org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Avoid AGP's synthetic JDK image transform, which is unnecessary for this
# Android-only Java 17 target and unreliable on this Windows host.
android.disableJdkImageTransform=true
# Pub's Android plugin sources are cached on C: while this repository is on E:.
# Kotlin incremental caches attempt to make those paths relative and fail when
# their drive roots differ. In-process, non-incremental compilation is slower
# on the first build but is reliable for Windows development on this layout.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
