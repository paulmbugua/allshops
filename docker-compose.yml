services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: allshops
      POSTGRES_USER: allshops
      POSTGRES_PASSWORD: allshops
    ports:
      - "5432:5432"
    volumes:
      - allshops_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allshops -d allshops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - allshops_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  allshops_postgres:
  allshops_redis:
