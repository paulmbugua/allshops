name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: allshops_test
          POSTGRES_USER: allshops
          POSTGRES_PASSWORD: allshops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allshops -d allshops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://allshops:allshops@localhost:5432/allshops_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000
      NODE_ENV: test
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder_only
      PAYSTACK_CURRENCY: QAR
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate && pnpm db:generate && pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:critical
      - run: pnpm test:security
      - run: pnpm security:audit
      - run: pnpm migrations:audit
      - run: pnpm build

  containers:
    runs-on: ubuntu-24.04
    needs: validate
    strategy:
      matrix:
        service: [web, api, worker]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/${{ matrix.service }}/Dockerfile -t allshops-${{ matrix.service }}:ci .
      - run: test "$(docker image inspect allshops-${{ matrix.service }}:ci --format '{{.Config.User}}')" = "allshops"

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
