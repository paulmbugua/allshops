name: Build mobile production AAB

on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: read

jobs:
  android:
    name: Clean validated Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      ALLSHOPS_API_URL: https://api.allshopspos.com/api/v1
      RELEASE_VERSION: 1.0.6+7
      SYMBOLS_DIR: build/release-symbols/1.0.6+7
      ALLSHOPS_ALLOW_UNSIGNED_CI_RELEASE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456"

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "version: $RELEASE_VERSION" pubspec.yaml

      - name: Clean, restore, analyze and test
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          rm -rf build .dart_tool android/.gradle
          flutter pub get
          flutter analyze
          flutter test --concurrency=1

      - name: Build production app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SYMBOLS_DIR"
          log_file="$RUNNER_TEMP/flutter-appbundle.log"
          set +e
          flutter build appbundle \
            --release \
            --target-platform android-arm64 \
            --obfuscate \
            --extra-gen-snapshot-options=--strip \
            --split-debug-info="$SYMBOLS_DIR/dart" \
            --dart-define="ALLSHOPS_API_URL=$ALLSHOPS_API_URL" \
            2>&1 | tee "$log_file"
          build_status=${PIPESTATUS[0]}
          set -e

          if [[ "$build_status" -ne 0 ]]; then
            log_tail=$(tail -n 60 "$log_file")
            log_tail=${log_tail//'%'/'%25'}
            log_tail=${log_tail//$'\r'/'%0D'}
            log_tail=${log_tail//$'\n'/'%0A'}
            echo "::error::Flutter appbundle build failed with exit code $build_status.%0A$log_tail"
            exit "$build_status"
          fi

          if grep -Eiq 'failed to strip|strip debug symbols.*failed|unable to strip|unobfuscated DWARF debugging information|use --strip to remove' "$log_file"; then
            echo "::error::Flutter reported a native debug-symbol stripping failure."
            exit 1
          fi

      - name: Preserve release diagnostics separately
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/app/outputs/bundle/release/app-release.aab"
          mkdir -p "$SYMBOLS_DIR/native" "$SYMBOLS_DIR/r8"
          unzip -j "$bundle" 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/*' \
            -d "$SYMBOLS_DIR/native" 2>/dev/null || true
          if [[ -f build/app/outputs/mapping/release/mapping.txt ]]; then
            cp build/app/outputs/mapping/release/mapping.txt "$SYMBOLS_DIR/r8/mapping.txt"
          fi

      - name: Enforce Play bundle size and stripping limits
        shell: bash
        run: |
          set -euo pipefail
          python3 ../../scripts/verify-mobile-release.py \
            build/app/outputs/bundle/release/app-release.aab \
            --max-libflutter-mib 20 \
            --max-bundle-mib 35 \
            --manifest build/app/outputs/bundle/release/release-manifest.json

      - name: Upload validated unsigned AAB for offline signing
        uses: actions/upload-artifact@v4
        with:
          name: AllShops-POS-1.0.6-build-7-validated-unsigned-aab
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/bundle/release/release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload private crash-diagnostic symbols
        uses: actions/upload-artifact@v4
        with:
          name: AllShops-POS-1.0.6-build-7-symbols
          path: apps/mobile/build/release-symbols/1.0.6+7
          if-no-files-found: error
          retention-days: 90
