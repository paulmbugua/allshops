name: Build mobile production AAB

on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: write

jobs:
  android:
    name: Clean validated Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      ALLSHOPS_API_URL: https://api.allshopspos.com/api/v1
      RELEASE_VERSION: 1.0.6+7
      SYMBOLS_DIR: build/release-symbols/1.0.6+7
      ALLSHOPS_ALLOW_UNSIGNED_CI_RELEASE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "version: $RELEASE_VERSION" pubspec.yaml

      - name: Clean, restore, analyze and test
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          rm -rf build .dart_tool android/.gradle
          flutter pub get
          flutter analyze
          flutter test --concurrency=1

      - name: Build production app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SYMBOLS_DIR/dart"
          log_file="$RUNNER_TEMP/flutter-appbundle.log"
          dart_define=$(printf '%s' "ALLSHOPS_API_URL=$ALLSHOPS_API_URL" | base64 -w0)
          symbols_path=$(realpath "$SYMBOLS_DIR/dart")
          ./android/gradlew \
            --no-daemon \
            --project-dir android \
            app:bundleRelease \
            -Ptarget-platform=android-arm64 \
            -Ptarget=lib/main.dart \
            -Pdart-obfuscation=true \
            -Pextra-gen-snapshot-options=--strip \
            -Psplit-debug-info="$symbols_path" \
            -Ptree-shake-icons=true \
            -Pdart-defines="$dart_define" \
            2>&1 | tee "$log_file"

          if grep -Eiq 'failed to strip|strip debug symbols.*failed|unable to strip|unobfuscated DWARF debugging information|use --strip to remove' "$log_file"; then
            echo "::error::Flutter reported a native debug-symbol stripping failure."
            exit 1
          fi

      - name: Verify delivered native libraries are stripped
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/app/outputs/bundle/release/app-release.aab"
          verify_dir="$RUNNER_TEMP/allshops-native-verify"
          mkdir -p "$verify_dir"
          for library in libapp.so libflutter.so; do
            entry=$(unzip -Z1 "$bundle" | grep -E "/lib/arm64-v8a/$library$" | head -n 1)
            test -n "$entry"
            unzip -p "$bundle" "$entry" > "$verify_dir/$library"
            if readelf --sections "$verify_dir/$library" | grep -Eq '\.debug_|\.symtab'; then
              echo "::error::$library still contains debug or symbol-table sections."
              exit 1
            fi
          done

      - name: Preserve release diagnostics separately
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/app/outputs/bundle/release/app-release.aab"
          mkdir -p "$SYMBOLS_DIR/native" "$SYMBOLS_DIR/r8"
          unzip -j "$bundle" 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/*' \
            -d "$SYMBOLS_DIR/native" 2>/dev/null || true
          if [[ -f build/app/outputs/mapping/release/mapping.txt ]]; then
            cp build/app/outputs/mapping/release/mapping.txt "$SYMBOLS_DIR/r8/mapping.txt"
          fi

      - name: Enforce Play bundle size and stripping limits
        shell: bash
        run: |
          set -euo pipefail
          python3 ../../scripts/verify-mobile-release.py \
            build/app/outputs/bundle/release/app-release.aab \
            --max-libflutter-mib 20 \
            --max-bundle-mib 35 \
            --manifest build/app/outputs/bundle/release/release-manifest.json

      - name: Upload validated unsigned AAB for offline signing
        uses: actions/upload-artifact@v4
        with:
          name: AllShops-POS-1.0.6-build-7-validated-unsigned-aab
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/bundle/release/release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload private crash-diagnostic symbols
        uses: actions/upload-artifact@v4
        with:
          name: AllShops-POS-1.0.6-build-7-symbols
          path: apps/mobile/build/release-symbols/1.0.6+7
          if-no-files-found: error
          retention-days: 90

      - name: Encrypt validated outputs for authenticated local handoff
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/app/outputs/bundle/release/app-release.aab"
          manifest="build/app/outputs/bundle/release/release-manifest.json"
          transport_dir="$RUNNER_TEMP/allshops-encrypted-transport"
          mkdir -p "$transport_dir"
          tar -C build/release-symbols -czf "$transport_dir/symbols.tar.gz" "1.0.6+7"
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$bundle" -outform DER \
            -out "$transport_dir/AllShops-POS-1.0.6-build-7-unsigned.aab.cms" \
            ../../ops/mobile-release-transport-cert.pem
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$transport_dir/symbols.tar.gz" -outform DER \
            -out "$transport_dir/AllShops-POS-1.0.6-build-7-symbols.tar.gz.cms" \
            ../../ops/mobile-release-transport-cert.pem
          cp "$manifest" "$transport_dir/release-manifest.json"

      - name: Publish encrypted handoff assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          transport_dir="$RUNNER_TEMP/allshops-encrypted-transport"
          gh release create "$GITHUB_REF_NAME" \
            "$transport_dir/AllShops-POS-1.0.6-build-7-unsigned.aab.cms" \
            "$transport_dir/AllShops-POS-1.0.6-build-7-symbols.tar.gz.cms" \
            "$transport_dir/release-manifest.json" \
            --prerelease \
            --title "AllShops 1.0.6+7 encrypted CI handoff" \
            --notes "Automated encrypted transport assets. The AAB requires decryption and Play upload signing before use."
