name: Build mobile production AAB

on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: read

jobs:
  android:
    name: Clean signed Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    env:
      ALLSHOPS_API_URL: https://api.allshopspos.com/api/v1
      RELEASE_VERSION: 1.0.5+6
      SYMBOLS_DIR: build/release-symbols/1.0.5+6

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install pinned Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456"

      - name: Restore upload signing key
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for value in UPLOAD_KEYSTORE_BASE64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_PASSWORD UPLOAD_KEY_ALIAS; do
            if [[ -z "${!value:-}" ]]; then
              echo "::error::Required GitHub secret $value is not configured."
              exit 1
            fi
          done
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          chmod 600 android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$UPLOAD_STORE_PASSWORD
          keyPassword=$UPLOAD_KEY_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          chmod 600 android/key.properties

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "version: $RELEASE_VERSION" pubspec.yaml

      - name: Clean, restore, analyze and test
        shell: bash
        run: |
          set -euo pipefail
          flutter clean
          rm -rf build .dart_tool android/.gradle
          flutter pub get
          flutter analyze
          flutter test --concurrency=1

      - name: Build production app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SYMBOLS_DIR"
          log_file="$RUNNER_TEMP/flutter-appbundle.log"
          flutter build appbundle \
            --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info="$SYMBOLS_DIR/dart" \
            --dart-define="ALLSHOPS_API_URL=$ALLSHOPS_API_URL" \
            2>&1 | tee "$log_file"

          if grep -Eiq 'failed to strip|strip debug symbols.*failed|unable to strip' "$log_file"; then
            echo "::error::Flutter reported a native debug-symbol stripping failure."
            exit 1
          fi

      - name: Preserve release diagnostics separately
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/app/outputs/bundle/release/app-release.aab"
          mkdir -p "$SYMBOLS_DIR/native" "$SYMBOLS_DIR/r8"
          unzip -j "$bundle" 'BUNDLE-METADATA/com.android.tools.build.debugsymbols/*' \
            -d "$SYMBOLS_DIR/native" 2>/dev/null || true
          if [[ -f build/app/outputs/mapping/release/mapping.txt ]]; then
            cp build/app/outputs/mapping/release/mapping.txt "$SYMBOLS_DIR/r8/mapping.txt"
          fi

      - name: Enforce Play bundle size and stripping limits
        shell: bash
        run: |
          set -euo pipefail
          python3 ../../scripts/verify-mobile-release.py \
            build/app/outputs/bundle/release/app-release.aab \
            --max-libflutter-mib 20 \
            --max-bundle-mib 35 \
            --manifest build/app/outputs/bundle/release/release-manifest.json

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: AllShops-POS-1.0.5-build-6-aab
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/bundle/release/release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload private crash-diagnostic symbols
        uses: actions/upload-artifact@v4
        with:
          name: AllShops-POS-1.0.5-build-6-symbols
          path: apps/mobile/build/release-symbols/1.0.5+6
          if-no-files-found: error
          retention-days: 365
