listen_addresses = '*'
port = 5432
max_connections = 120

# Conservative 16 GB VPS profile. Leave RAM for Docker workloads and OS cache.
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 256MB
work_mem = 8MB
huge_pages = try

wal_level = replica
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = on
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
deadlock_timeout = 1s

password_encryption = scram-sha-256
ssl = off
